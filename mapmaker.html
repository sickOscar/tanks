const sources =  [0, 1, 2, 3, 4, 5, 6]

function Tile(x, y, val) {
  this.x = x;
  this.y = y;
  this.color = val;
}

let tiles = []
let tileSize = 30

let selectedColor = null;

function setup() {
  createCanvas(1000, 1000);
  frameRate(5)
  
  for (let i = 0; i < map.length; i++)  {
    for (let j = 0; j < map[i].length; j++) {
      let tile = new Tile(j, i, map[i][j])
      tiles.push(tile)
    }
    
  }
  console.log(tiles.length)
}

function draw() {
  background(220);
  
  for (let tile of tiles) {
    
    fill(getColor(tile.color))
    
    square(tile.x * tileSize, tile.y *tileSize, tileSize)
  }
  
  for (let  i = 0; i < sources.length; i++) {
    fill(getColor(sources[i]))
    square(i * tileSize, map.length * tileSize + 40, tileSize)
    
  }
  
}

function mouseClicked() {
  console.log(mouseX, mouseY)
  
  if (mouseY > map.length * tileSize) {
    // prendi colore
    let x = Math.floor(mouseX / tileSize)
    selectedColor = sources[x]
    console.log(selectedColor)
    return
  }


	if (mouseX > map[0].length * tileSize) {
	return
  }
  
  let x = Math.floor(mouseX / tileSize)
  let y = Math.floor(mouseY / tileSize)
  
  console.log(x, y)
  
  tiles[(x) + (y * map[0].length)].color = selectedColor
  map[y][x] = selectedColor
  console.log(JSON.stringify(map))    
  
}

function getColor(c) {
  let tileColor = 'red'
    
    switch (Math.trunc(c)) {
      case 0:
        tileColor =  'green';
        break
      case 1:
        tileColor = 'blue';
        break
      case 2:
        tileColor = 'yellow';
        break
      case 3:
        tileColor = 'darkgreen';
        break
      case 4:
        tileColor = 'darkgray';
        break
      case 5:
        tileColor = 'olive';
        break
      case 6:
        tileColor = 'white';
        break
      default:
        tileColor =  'black';
        break;
    }
  return tileColor
}
